<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091426"><title>FORTRESS · بوابة المنصات</title><style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#122239;--line:#2b405b;--gold:#e4c27c;--text:#edf3fb;--muted:#9aabc0;--green:#74d9b1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#263d5e,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,Tahoma,Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.brand{font-weight:900;letter-spacing:2px;font-size:22px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.notice{border:1px solid #6b562e;background:#332b1c;color:#ead7aa;border-radius:14px;padding:13px;line-height:1.8;font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.platform{background:linear-gradient(145deg,#172b45,#0e1b2d);border:1px solid var(--line);border-radius:17px;padding:17px;cursor:pointer;text-align:right;color:var(--text);min-height:120px}.platform.active{border-color:var(--gold);box-shadow:0 0 0 1px #e4c27c33}.platform b{display:block;font-size:15px}.platform small{display:block;color:var(--muted);margin-top:8px;line-height:1.6}.panel{background:linear-gradient(145deg,#14263e,#0e1a2b);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button,.btn{border:1px solid var(--line);border-radius:11px;background:#1b304a;color:var(--text);padding:11px 15px;cursor:pointer}.tabs button.active,.btn.primary{background:linear-gradient(120deg,#efd69e,#c49a50);color:#1d2632;border:0;font-weight:800}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.field{display:grid;gap:7px;margin:8px 0}.field label{font-size:12px;color:#bac8d9}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#081525;color:white}.full{grid-column:1/-1}.hidden{display:none!important}.muted{color:var(--muted);font-size:12px}.msg{padding:12px;border-radius:10px;margin-top:12px;background:#17392f;color:#b9f1d8;font-size:12px}.msg.err{background:#48272d;color:#ffd1d5}.btn{margin-top:10px}.token{direction:ltr;overflow-wrap:anywhere;background:#081525;border:1px solid var(--line);padding:10px;border-radius:9px;font-size:11px}@media(max-width:650px){.wrap{padding:15px}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><header class="head"><div class="brand">FORTRESS GROUP<small>INDEPENDENT PLATFORM PORTAL</small></div><div class="muted">حساب مستقل لكل منصة · تسجيل أفراد وشركات</div></header><div class="notice">كل منصة لها حسابات منفصلة. يمكنك استخدام البريد نفسه لإنشاء حساب مستقل في منصة أخرى. التسجيل لن يتاح إلا بعد تفعيل المنصة واعتماد متطلبات إطلاقها.</div><h3>اختر المنصة</h3><section class="grid" id="platforms"></section><section class="panel hidden" id="accountPanel"><h3 id="selectedTitle">الحساب</h3><div class="tabs"><button class="active" id="loginTab" onclick="setMode('login')">تسجيل الدخول</button><button id="registerTab" onclick="setMode('register')">إنشاء حساب</button></div><form id="accountForm"><div class="fields"><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>كلمة المرور (12 حرفًا على الأقل)</label><input name="password" type="password" minlength="12" autocomplete="current-password" required></div><div class="field registerOnly hidden"><label>الاسم الظاهر</label><input name="displayName" maxlength="100"></div><div class="field registerOnly hidden"><label>نوع الحساب</label><select name="accountType" id="accountType" onchange="toggleCompany()"><option value="user">مستخدم</option><option value="company">شركة</option></select></div><div class="field companyOnly hidden"><label>اسم الشركة</label><input name="companyName"></div><div class="field companyOnly hidden"><label>الاسم القانوني</label><input name="legalName"></div><div class="field companyOnly hidden"><label>رمز الدولة ISO</label><input name="countryCode" maxlength="2" placeholder="EG"></div></div><button class="btn primary" id="submitBtn">دخول</button></form><div id="message"></div></section></main><script>
const catalog=[['ads','FORTRESS ADS','الإعلانات والحملات التسويقية'],['tasks','FORTRESS TASKS','المهام والتشغيل والمكافآت'],['market','FORTRESS MARKET','سوق المنتجات والخدمات'],['business','FORTRESS BUSINESS','حلول الشركات والاشتراكات'],['partners','FORTRESS PARTNERS','الشراكات والعمولات'],['research','FORTRESS RESEARCH','الأبحاث والاستطلاعات'],['loyalty','FORTRESS LOYALTY','نقاط الولاء والمكافآت'],['technology','FORTRESS TECHNOLOGY','الخدمات التقنية وواجهات API']];let selected='',mode='login';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#platforms').innerHTML=catalog.map(([slug,name,desc])=>`<button class="platform" data-slug="${slug}" onclick="choose('${slug}')"><b>${name}</b><small>${desc}</small></button>`).join('');function choose(slug){selected=slug;document.querySelectorAll('.platform').forEach(x=>x.classList.toggle('active',x.dataset.slug===slug));$('#accountPanel').classList.remove('hidden');$('#selectedTitle').textContent=catalog.find(x=>x[0]===slug)[1];$('#message').innerHTML='';setMode('login');$('#accountPanel').scrollIntoView({behavior:'smooth',block:'start'})}function setMode(next){mode=next;$('#loginTab').classList.toggle('active',mode==='login');$('#registerTab').classList.toggle('active',mode==='register');document.querySelectorAll('.registerOnly').forEach(x=>x.classList.toggle('hidden',mode!=='register'));$('#submitBtn').textContent=mode==='login'?'تسجيل الدخول':'إنشاء الحساب';$('#accountForm').elements.password.autocomplete=mode==='login'?'current-password':'new-password';toggleCompany()}function toggleCompany(){const show=mode==='register'&&$('#accountType').value==='company';document.querySelectorAll('.companyOnly').forEach(x=>x.classList.toggle('hidden',!show));['companyName','legalName','countryCode'].forEach(n=>$('#accountForm').elements[n].required=show)}$('#accountForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const f=new FormData(e.target),data=Object.fromEntries(f);const path=mode==='login'?`/api/platforms/${selected}/login`:`/api/platforms/${selected}/register`;$('#submitBtn').disabled=true;$('#message').innerHTML='';try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.message||`HTTP ${r.status}`);sessionStorage.setItem(`fortress_${selected}_token`,d.token);$('#message').innerHTML=`<div class="msg">${mode==='login'?'تم تسجيل الدخول بنجاح.':'تم إنشاء الحساب.'}<p class="muted">معرّف الحساب: ${esc(d.account.id)}</p><p class="muted">تم حفظ جلسة هذه المنصة في الجلسة الحالية على هذا الجهاز. لا تشارك بيانات الدخول مع أي شخص.</p></div>`;e.target.reset()}catch(x){$('#message').innerHTML=`<div class="msg err">${esc(x.message)}</div>`}finally{$('#submitBtn').disabled=false}};
</script></body></html>
